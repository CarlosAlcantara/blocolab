<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlocoLab — Guia do professor</title>
<link rel="stylesheet" href="css/estilo.css">
<style>
  .guia { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
  .guia h1 { margin: 0 0 6px; }
  .guia section.aula { background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 16px 20px; margin: 18px 0; }
  .guia h2 { margin: 0 0 8px; color: var(--pri2); }
  .guia h3 { margin: 16px 0 6px; font-size: 1.02rem; }
  .guia ul { margin: 0 0 8px; padding-left: 22px; }
  .guia p { margin: 0 0 8px; }
  .desafio { border-top: 1px dashed var(--borda); padding-top: 10px; margin-top: 10px; }
  .desafio h4 { margin: 0 0 4px; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .duas pre { margin: 0; font-size: .82rem; white-space: pre-wrap; }
  .blocos-txt { background: #f8fafc; color: #1e293b; border: 1px solid var(--borda); padding: 10px; border-radius: 10px; font-family: ui-monospace, Consolas, monospace; }
  .rotulo { font-size: .72rem; font-weight: 800; text-transform: uppercase; color: var(--sut); letter-spacing: .5px; margin-bottom: 2px; }
  .resumo td, .resumo th { border-bottom: 1px solid var(--borda); padding: 6px 8px; text-align: left; vertical-align: top; }
  .resumo { border-collapse: collapse; width: 100%; background: #fff; border-radius: 12px; overflow: hidden; }
  .nao-imprimir { margin: 10px 0; }
  @media (max-width: 700px) { .duas { grid-template-columns: 1fr; } }
  @media print {
    body { background: #fff; font-size: 12px; }
    .topo, .nao-imprimir { display: none; }
    .guia section.aula { break-inside: auto; border: 0; padding: 0; }
    .desafio { break-inside: avoid; }
    .codigo { background: #f8fafc; color: #000; border: 1px solid #ccc; }
  }
</style>
</head>
<body>
<header class="topo"><a class="voltar" href="index.html">← Voltar ao site</a><div class="topo-titulo">Guia do professor</div></header>
<main class="guia" id="guia"></main>
<script src="js/motor.js"></script>
<script src="js/licoes.js"></script>
<script src="js/professor.js"></script>
</body>
</html>
